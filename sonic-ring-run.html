<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sonic Ring Run</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#08142f;color:white;font:16px system-ui;display:flex;justify-content:center}.app{width:min(100%,850px);padding:12px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:clamp(20px,4vw,30px);margin:4px 0}.stats{display:flex;gap:7px}.pill{background:#19335f;border:1px solid #6387dd;border-radius:20px;padding:6px 10px;font-weight:800}.stage{position:relative;border:3px solid #76a2ff;border-radius:15px;overflow:hidden;background:#65d7ff}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.overlay{position:absolute;inset:0;background:#071532bb;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:12px}.overlay.hide{display:none}.overlay h2{font-size:clamp(28px,6vw,44px);margin:0}.overlay p{max-width:430px;line-height:1.4;font-weight:650;margin:0}button{font:inherit;font-weight:900;border:0;border-radius:13px;touch-action:manipulation;user-select:none}.start{padding:13px 20px;background:#ffe14d;color:#17244c;font-size:19px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:10px 0}.control{min-height:76px;background:#1746a4;color:white;border:2px solid #85a8ff;box-shadow:0 4px #09285f;font-size:clamp(16px,4vw,21px)}.control small{display:block;font-size:12px}.control:active{transform:translateY(3px);box-shadow:0 1px #09285f}.help{text-align:center;color:#d0ddff;font-size:13px}
</style></head><body><main class="app"><div class="top"><h1>💨 SONIC: RING RUN</h1><div class="stats"><span class="pill">💍 <b id="rings">0</b></span><span class="pill">⭐ <b id="score">0</b></span><span class="pill">⚡ <b id="speed">1.0×</b></span></div></div>
<div class="stage"><canvas id="game" width="800" height="400"></canvas><div class="overlay" id="overlay"><h2 id="title">SONIC RING RUN!</h2><p id="msg">Jump over crates, duck under flying bots, and collect golden rings. Use the big touch buttons below!</p><button class="start" id="play">▶ TAP TO PLAY</button></div></div>
<div class="controls"><button class="control" id="jump">⬆️ JUMP<small>Tap to leap</small></button><button class="control" id="duck">⬇️ DUCK<small>Hold to slide</small></button><button class="control" id="restart">↻ RESTART<small>Play again</small></button></div><p class="help">Touch controls only. No login or keyboard needed. Avoid obstacles and collect rings!</p></main>
<script>
(()=>{'use strict';
const cv=document.getElementById('game'),x=cv.getContext('2d'),W=800,H=400,F=315,$=id=>document.getElementById(id);
let mode='ready',last=0,t=0,score=0,rings=0,spd=4.5,obs=[],coins=[],dust=[],ot=45,ct=30,ducking=false;
let p={x:110,y:F-42,w:38,h:42,vy:0,ground:true};
function reset(){mode='ready';last=0;t=0;score=0;rings=0;spd=4.5;obs=[];coins=[];dust=[];ot=45;ct=30;ducking=false;p={x:110,y:F-42,w:38,h:42,vy:0,ground:true};stats();$('title').textContent='SONIC RING RUN!';$('msg').textContent='Jump over crates, duck under flying bots, and collect golden rings. Use the big touch buttons below!';$('play').textContent='▶ TAP TO PLAY';$('overlay').classList.remove('hide');draw()}
function stats(){$('rings').textContent=rings;$('score').textContent=Math.floor(score);$('speed').textContent=(spd/4.5).toFixed(1)+'×'}
function start(){if(mode==='playing')return;mode='playing';$('overlay').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}
function jump(){if(mode!=='playing')start();if(p.ground&&!ducking){p.vy=-13;p.ground=false;burst(p.x+20,p.y+20,'#ffe44f',6)}}
function duck(on){ducking=on;if(on&&mode!=='playing')start()}
function burst(a,b,col,n){for(let i=0;i<n;i++)dust.push({x:a,y:b,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,life:22,col})}
function obstacle(){if(Math.random()<.35)obs.push({kind:'bot',x:W+10,y:F-73,w:50,h:24});else obs.push({kind:'crate',x:W+10,y:F-38,w:38,h:38})}
function ringLine(){let y=F-65-Math.random()*90,n=3+Math.floor(Math.random()*3);for(let i=0;i<n;i++)coins.push({x:W+10+i*29,y:y-(i%2)*8})}
function stop(){mode='over';$('overlay').classList.remove('hide');$('title').textContent='💥 CRASH!';$('msg').textContent='Score: '+Math.floor(score)+' · Rings: '+rings+'. Tap PLAY AGAIN or RESTART to run again.';$('play').textContent='↻ PLAY AGAIN'}
function update(d){t+=d;score+=d*.16;spd=Math.min(10.5,4.5+t/1000);if(!p.ground){p.vy+=.6*d;p.y+=p.vy*d;if(p.y>=F-p.h){p.y=F-p.h;p.vy=0;p.ground=true}}p.h=ducking&&p.ground?24:42;if(p.ground)p.y=F-p.h;
ot-=d;if(ot<=0){obstacle();ot=Math.max(30,65+Math.random()*35-(spd-4.5)*3)}ct-=d;if(ct<=0){ringLine();ct=100+Math.random()*60}
obs.forEach(o=>o.x-=spd*d);obs=obs.filter(o=>o.x+o.w>0);
coins.forEach(r=>{r.x-=spd*d;if(!r.got&&Math.hypot(r.x-(p.x+18),r.y-(p.y+p.h/2))<29){r.got=true;rings++;score+=20;burst(r.x,r.y,'#ffcd32',7)}});coins=coins.filter(r=>r.x>0&&!r.got);
for(const o of obs){if(p.x+ p.w-5>o.x+4&&p.x+5<o.x+o.w-4&&p.y+p.h-3>o.y+2&&p.y+4<o.y+o.h-2){stop();return}}
dust.forEach(a=>{a.x+=a.vx*d;a.y+=a.vy*d;a.vy+=.1*d;a.life-=d});dust=dust.filter(a=>a.life>0);stats()}
function box(a,b,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#55caff');g.addColorStop(1,'#e2fbff');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fff3a0';x.beginPath();x.arc(700,55,27,0,7);x.fill();
for(let i=0;i<5;i++){let a=((i*190-t*1.2)%(W+100)+W+100)%(W+100)-40,b=70+i%2*35;x.fillStyle='#ffffffdc';x.beginPath();x.arc(a,b,17,0,7);x.arc(a+21,b-8,22,0,7);x.arc(a+43,b+2,16,0,7);x.fill()}
x.fillStyle='#55d49b';x.beginPath();x.moveTo(0,F);for(let a=0;a<=W;a+=16)x.lineTo(a,255+Math.sin((a+t*2)/60)*22);x.lineTo(W,F);x.fill();x.fillStyle='#20a64c';x.fillRect(0,F,W,H-F);x.fillStyle='#e7c56b';x.fillRect(0,F+12,W,H-F-12);x.fillStyle='#14843d';for(let a=0;a<W;a+=38)x.fillRect(((a-t*spd*2)%38+38)%38,F+3,20,6);
x.fillStyle='#0002';x.beginPath();x.ellipse(p.x+18,F+2,24,6,0,0,7);x.fill();x.save();x.translate(p.x,p.y);
if(ducking&&p.ground){box(0,5,39,19,9,'#0875f5');box(14,16,24,8,4,'#e9273c')}else{x.fillStyle='#075fd8';x.beginPath();x.moveTo(13,16);x.lineTo(-7,4);x.lineTo(3,25);x.lineTo(-5,32);x.lineTo(15,34);x.fill();x.fillStyle='#0875f5';x.beginPath();x.ellipse(20,20,17,21,-.12,0,7);x.fill();x.fillStyle='#f7c7a0';x.beginPath();x.ellipse(26,28,10,7,0,0,7);x.fill();x.fillStyle='white';x.beginPath();x.ellipse(26,12,6,9,0,0,7);x.ellipse(34,13,5,7,0,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(28,13,2.3,0,7);x.arc(35,13,2,0,7);x.fill();box(16,35,19,7,4,'#ed2639');box(1,36,18,7,4,'#ed2639');x.fillStyle='white';x.fillRect(21,37,9,2);x.fillRect(5,38,8,2)}x.restore();
obs.forEach(o=>{if(o.kind==='crate'){box(o.x,o.y,o.w,o.h,4,'#a65d2c');box(o.x+5,o.y+5,o.w-10,o.h-10,3,'#d88a44');x.strokeStyle='#7c3e20';x.lineWidth=3;x.beginPath();x.moveTo(o.x+7,o.y+7);x.lineTo(o.x+o.w-7,o.y+o.h-7);x.moveTo(o.x+o.w-7,o.y+7);x.lineTo(o.x+7,o.y+o.h-7);x.stroke()}else{box(o.x,o.y,o.w,o.h,11,'#6c5cbd');box(o.x+10,o.y+6,13,7,3,'#b7f6ff');box(o.x+31,o.y+6,13,7,3,'#b7f6ff')}});coins.forEach(r=>{x.strokeStyle='#ffbd18';x.lineWidth=6;x.beginPath();x.arc(r.x,r.y,9,0,7);x.stroke();x.strokeStyle='#fff2a1';x.lineWidth=2;x.beginPath();x.arc(r.x-2,r.y-2,6,-1.4,.6);x.stroke()});dust.forEach(a=>{x.globalAlpha=Math.max(0,a.life/22);x.fillStyle=a.col;x.beginPath();x.arc(a.x,a.y,3.5,0,7);x.fill();x.globalAlpha=1});if(mode==='playing'){x.fillStyle='#09245a';x.font='bold 16px system-ui';x.fillText('RUN!',18,25)}}
function loop(now){if(mode!=='playing')return;let d=Math.min(2.3,(now-last)/16.67||1);last=now;update(d);draw();if(mode==='playing')requestAnimationFrame(loop)}
function bind(id,fn){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();fn()})}
bind('jump',jump);let db=$('duck');db.addEventListener('pointerdown',e=>{e.preventDefault();duck(true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>db.addEventListener(ev,()=>duck(false)));
$('play').addEventListener('click',()=>{if(mode==='over')reset();start()});$('restart').addEventListener('click',()=>{reset();start()});cv.addEventListener('pointerdown',()=>{if(mode!=='playing')start();else jump()});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.code==='ArrowDown')duck(true);if(e.code==='KeyR'){$('restart').click()}});window.addEventListener('keyup',e=>{if(e.code==='ArrowDown')duck(false)});
reset();
})();</script></body></html>
